#
# Release pipeline for Vincent. Fires on a pushed `vX.Y.Z` tag: runs the
# full test suite, cross-compiles three static binaries, and attaches them
# to a GitHub release for that tag.
#
# The build matrix covers the three platforms CI already tests: macOS
# (Apple Silicon), Linux, and Windows. CGO_ENABLED=0 on all three keeps
# every binary static, matching test.yml's non-race build and the
# single-static-binary rule in CLAUDE.md.
#
# Tests run first, on ubuntu-latest only, so a broken tag never reaches
# the build step and ships a binary the suite would have caught.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o vincent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vincent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: vincent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # checksums.txt lets the herdr plugin's install step verify the binary
      # it downloads (herdr/install.sh), and lets anyone else do the same.
      - name: Write checksums
        run: cd dist && sha256sum vincent-* > checksums.txt && cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
