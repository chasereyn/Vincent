#
# Test pipeline for Vincent. Runs `go test ./...` with the race detector on
# every push and pull request.
#
# Windows is in the matrix deliberately. spice-edit tested Linux + macOS
# only, and as a result eighteen of its tests failed on Windows — every one
# of them a POSIX path literal baked into an assertion rather than a real
# bug in the code under test. Vincent is developed on Windows today and
# moves to macOS later, so all three run here and that class of failure
# cannot come back unnoticed.

name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-flight runs for the same ref when a new push lands. Saves CI
# minutes when someone pushes a quick fix on top of an in-progress run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod / go.sum are not tidy. Run 'make tidy' and commit." >&2
            git --no-pager diff go.mod go.sum
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      # Print a coverage summary into the run log so reviewers can see
      # the trend at a glance without downloading the artifact.
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 30

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
